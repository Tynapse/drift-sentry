[project]
name = "tynapse-drift-sentry"
version = "1.0.0"
description = "DriftSentry data generation, LoRA training, evaluation, and serving utilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.34.0",
  "datasets>=2.19.0",
  "peft>=0.12.0",
  "safetensors>=0.4.3",
  "scikit-learn>=1.5.0",
  "torch>=2.12.1",
  "transformers>=5.12.1",
  "trl>=0.9.6",
]
eval = [
  "numpy>=1.26.0",
  "peft>=0.12.0",
  "scikit-learn>=1.5.0",
  "torch>=2.12.1",
  "transformers>=5.12.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["drift_sentry*"]
